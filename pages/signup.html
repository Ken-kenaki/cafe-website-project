<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cafe Delight</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2C1810;
            --coffee-medium: #5C4033;
            --coffee-light: #8B6F47;
            --cream: #F5E6D3;
            --cream-light: #FAF3E8;
            --accent-gold: #D4AF37;
            --accent-warm: #E07A5F;
            --text-dark: #2C1810;
            --text-light: #F5E6D3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            color: var(--text-dark);
            background: var(--cream-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            padding: 3rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(44, 24, 16, 0.1);
            margin: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .signup-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--coffee-dark);
        }

        .signup-header p {
            font-size: 1rem;
            color: var(--coffee-medium);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--coffee-dark);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--cream);
            border-radius: 10px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--cream-light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: white;
        }

        .btn-create {
            width: 100%;
            padding: 1.2rem;
            background: var(--coffee-dark);
            color: var(--cream);
            border: 2px solid var(--coffee-dark);
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-create:hover {
            background: var(--coffee-medium);
            border-color: var(--coffee-medium);
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--coffee-medium);
        }

        .login-link a {
            color: var(--coffee-dark);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: var(--accent-gold);
        }

        .password-requirements {
            font-size: 0.85rem;
            color: var(--coffee-medium);
            margin-top: 0.5rem;
            padding: 0.8rem;
            background: var(--cream-light);
            border-radius: 8px;
            display: none;
        }

        .password-requirements.show {
            display: block;
        }

        .password-requirements ul {
            margin-left: 1.2rem;
            margin-top: 0.5rem;
        }

        .password-requirements li {
            margin: 0.3rem 0;
        }

        .error-message {
            color: var(--accent-warm);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .signup-container {
                padding: 2rem;
            }

            .signup-header h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Create Your Account!</h1>
            <p>Log in to your account and manage your coffee orders.</p>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
                <div class="password-requirements" id="passwordReqs">
                    <strong>Password must contain:</strong>
                    <ul>
                        <li>At least 8 characters</li>
                        <li>One uppercase letter</li>
                        <li>One number</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Enter your password" required>
                <div class="error-message" id="confirmError"></div>
            </div>

            <button type="submit" class="btn-create">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordReqs = document.getElementById('passwordReqs');
        const confirmError = document.getElementById('confirmError');
        const emailError = document.getElementById('emailError');

        // Show password requirements on focus
        passwordInput.addEventListener('focus', function() {
            passwordReqs.classList.add('show');
        });

        passwordInput.addEventListener('blur', function() {
            setTimeout(() => {
                passwordReqs.classList.remove('show');
            }, 200);
        });

        // Validate password match
        confirmPasswordInput.addEventListener('input', function() {
            if (this.value && this.value !== passwordInput.value) {
                confirmError.textContent = 'Passwords do not match';
                confirmError.classList.add('show');
            } else {
                confirmError.classList.remove('show');
            }
        });

        // Validate email format
        document.getElementById('email').addEventListener('blur', function() {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (this.value && !emailRegex.test(this.value)) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('show');
            } else {
                emailError.classList.remove('show');
            }
        });

        // Form submission
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validate password strength
            const hasMinLength = password.length >= 8;
            const hasUpperCase = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);

            if (!hasMinLength || !hasUpperCase || !hasNumber) {
                alert('Password does not meet requirements. Please check and try again.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            const formData = {
                fullname: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                password: password
            };

            console.log('Account created:', formData);
            alert('Account created successfully! Please login.');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
