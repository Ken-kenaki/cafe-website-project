<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Cafe Delight</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2C1810;
            --coffee-medium: #5C4033;
            --coffee-light: #8B6F47;
            --cream: #F5E6D3;
            --cream-light: #FAF3E8;
            --accent-gold: #D4AF37;
            --accent-warm: #E07A5F;
            --text-dark: #2C1810;
            --text-light: #F5E6D3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            color: var(--text-dark);
            background: var(--cream-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-container {
            width: 100%;
            max-width: 500px;
            padding: 3rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(44, 24, 16, 0.1);
            margin: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .forgot-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--coffee-dark);
        }

        .forgot-header p {
            font-size: 1rem;
            color: var(--coffee-medium);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--coffee-dark);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--cream);
            border-radius: 10px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--cream-light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: white;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-request,
        .btn-login {
            flex: 1;
            padding: 1.1rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-request {
            background: transparent;
            color: var(--coffee-dark);
            border-color: var(--coffee-dark);
        }

        .btn-request:hover {
            background: var(--cream);
        }

        .btn-login {
            background: var(--coffee-dark);
            color: var(--cream);
            border-color: var(--coffee-dark);
        }

        .btn-login:hover {
            background: var(--coffee-medium);
            border-color: var(--coffee-medium);
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--coffee-medium);
        }

        .back-link a {
            color: var(--coffee-dark);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--accent-gold);
        }

        .success-message {
            background: #4CAF50;
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .info-box {
            background: var(--cream-light);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            border-left: 4px solid var(--accent-gold);
        }

        .info-box p {
            font-size: 0.95rem;
            color: var(--coffee-medium);
            line-height: 1.6;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .forgot-container {
                padding: 2rem;
            }

            .forgot-header h1 {
                font-size: 2.5rem;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="forgot-header">
            <h1>Forgot Password ?</h1>
            <p>Log in to your account and manage your coffee orders.</p>
        </div>

        <div class="success-message" id="successMessage">
            OTP has been sent to your email! Please check your inbox.
        </div>

        <div class="info-box">
            <p>Enter your email address and we'll send you a one-time password (OTP) to reset your password.</p>
        </div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-request">Request OTP</button>
                <a href="login.html" class="btn-login">Login</a>
            </div>
        </form>

        <div class="back-link">
            Remember your password? <a href="login.html">Back to login</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const successMessage = document.getElementById('successMessage');

            console.log('Password reset requested for:', email);
            
            // Show success message
            successMessage.classList.add('show');

            // Simulate OTP sending
            setTimeout(() => {
                alert('A one-time password has been sent to ' + email + '\n\nIn a real application, check your email to continue the password reset process.');
            }, 500);

            // Hide success message after 5 seconds
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 5000);
        });
    </script>
</body>
</html>
