<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Cafe Delight</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <nav class="nav-wrapper">
            <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="Cafe Delight Logo"></a>
            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="our-story.html">Our Story</a>
                <a href="contact.html">Contact</a>
                <a href="order.html" class="btn-nav">Order Now</a>
            </div>
            <button class="mobile-menu-btn" aria-label="Toggle menu"><span class="hamburger"><i class="fas fa-bars"></i></span><span class="close" style="display:none;"><i class="fas fa-times"></i></span></button>
            <div class="mobile-nav-container">
                <div class="mobile-nav-overlay"></div>
                <ul class="mobile-nav-links">
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="menu.html"><i class="fas fa-mug-hot"></i> Menu</a></li>
                    <li><a href="our-story.html"><i class="fas fa-book-open"></i> Our Story</a></li>
                    <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
                    <li><a href="order.html" class="btn-nav"><i class="fas fa-shopping-bag"></i> Order Now</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- ===== AUTH PAGE ===== -->
    <section class="auth-page">
        <div class="auth-container reveal">
            <div class="auth-icon"><i class="fas fa-key"></i></div>
            <h1>Reset Password</h1>
            <p class="auth-subtitle">Enter your email and we'll send you a one-time code to reset your password.</p>

            <!-- Step 1: Email -->
            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-wide">Send OTP</button>
            </form>

            <!-- Step 2: OTP + New Password (hidden initially) -->
            <form id="resetForm" style="display:none;" novalidate>
                <div class="form-group">
                    <label for="otp">One-Time Code</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-hashtag"></i>
                        <input type="text" id="otp" name="otp" placeholder="6-digit code" maxlength="6" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Min. 8 characters" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-wide">Reset Password</button>
            </form>

            <p class="auth-footer">Remember your password? <a href="login.html" class="form-link">Sign in</a></p>
        </div>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
    <script>
        let resetEmail = '';

        /* Step 1 — Request OTP */
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            if (!email) {
                storage.showToast('Please enter your email.', 'error');
                return;
            }
            if (!storage.validateEmail(email)) {
                storage.showToast('Please enter a valid email.', 'error');
                return;
            }

            const result = auth.resetPassword(email);
            if (result.success) {
                resetEmail = email;
                storage.showToast('OTP sent! Check your email (demo: use 123456).', 'success');
                document.getElementById('forgotForm').style.display = 'none';
                document.getElementById('resetForm').style.display = 'block';
            } else {
                storage.showToast(result.message || 'Email not found.', 'error');
            }
        });

        /* Step 2 — Verify OTP & Reset */
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            if (!otp || !newPassword) {
                storage.showToast('Please fill in all fields.', 'error');
                return;
            }
            if (!storage.validatePassword(newPassword)) {
                storage.showToast('Password must be at least 8 characters with a number and uppercase letter.', 'error');
                return;
            }

            /* Demo: accept any 6-digit OTP */
            if (otp.length === 6) {
                storage.showToast('Password reset successfully! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                storage.showToast('Invalid OTP. Please try again.', 'error');
            }
        });
    </script>
</body>
</html>
