<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Cafe Delight</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <nav class="nav-wrapper">
            <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="Cafe Delight Logo"></a>
            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="our-story.html">Our Story</a>
                <a href="contact.html">Contact</a>
                <a href="order.html" class="btn-nav">Order Now</a>
            </div>
            <button class="mobile-menu-btn" aria-label="Toggle menu"><span class="hamburger"><i class="fas fa-bars"></i></span><span class="close" style="display:none;"><i class="fas fa-times"></i></span></button>
            <div class="mobile-nav-container">
                <div class="mobile-nav-overlay"></div>
                <ul class="mobile-nav-links">
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="menu.html"><i class="fas fa-mug-hot"></i> Menu</a></li>
                    <li><a href="our-story.html"><i class="fas fa-book-open"></i> Our Story</a></li>
                    <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
                    <li><a href="order.html" class="btn-nav"><i class="fas fa-shopping-bag"></i> Order Now</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- ===== AUTH PAGE ===== -->
    <section class="auth-page">
        <div class="auth-container reveal">
            <div class="auth-icon"><i class="fas fa-mug-hot"></i></div>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your Cafe Delight account</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>
                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="forgot-password.html" class="form-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-wide">Sign In</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="signup.html" class="form-link">Create one</a></p>
        </div>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                storage.showToast('Please fill in all fields.', 'error');
                return;
            }
            if (!storage.validateEmail(email)) {
                storage.showToast('Please enter a valid email.', 'error');
                return;
            }

            const result = auth.login(email, password);
            if (result.success) {
                storage.showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1200);
            } else {
                storage.showToast(result.message || 'Invalid credentials.', 'error');
            }
        });
    </script>
</body>
</html>
