<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cafe Delight</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2C1810;
            --coffee-medium: #5C4033;
            --coffee-light: #8B6F47;
            --cream: #F5E6D3;
            --cream-light: #FAF3E8;
            --accent-gold: #D4AF37;
            --accent-warm: #E07A5F;
            --text-dark: #2C1810;
            --text-light: #F5E6D3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            color: var(--text-dark);
            background: var(--cream-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            padding: 3rem;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(44, 24, 16, 0.1);
            margin: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .login-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--coffee-dark);
        }

        .login-header p {
            font-size: 1rem;
            color: var(--coffee-medium);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--coffee-dark);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--cream);
            border-radius: 10px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--cream-light);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: white;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn-forgot,
        .btn-login {
            flex: 1;
            padding: 1.1rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid;
            font-size: 1rem;
            text-decoration: none;
            text-align: center;
            display: inline-block;
        }

        .btn-forgot {
            background: transparent;
            color: var(--coffee-dark);
            border-color: var(--coffee-dark);
        }

        .btn-forgot:hover {
            background: var(--cream);
        }

        .btn-login {
            background: var(--coffee-dark);
            color: var(--cream);
            border-color: var(--coffee-dark);
        }

        .btn-login:hover {
            background: var(--coffee-medium);
            border-color: var(--coffee-medium);
            transform: translateY(-2px);
        }

        .signup-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--coffee-medium);
        }

        .signup-link a {
            color: var(--coffee-dark);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: var(--accent-gold);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                padding: 2rem;
            }

            .login-header h1 {
                font-size: 2.5rem;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back!</h1>
            <p>Log in to your account and manage your coffee orders.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-actions">
                <a href="forgot-password.html" class="btn-forgot">Forgot Password?</a>
                <button type="submit" class="btn-login">Login</button>
            </div>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up here</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            console.log('Login attempted:', formData);
            alert('Login successful! Welcome back.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
