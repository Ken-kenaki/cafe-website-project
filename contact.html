<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Cafe Delight</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --coffee-dark: #2C1810;
            --coffee-medium: #5C4033;
            --coffee-light: #8B6F47;
            --cream: #F5E6D3;
            --cream-light: #FAF3E8;
            --accent-gold: #D4AF37;
            --accent-warm: #E07A5F;
            --text-dark: #2C1810;
            --text-light: #F5E6D3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            color: var(--text-dark);
            background: var(--cream-light);
            line-height: 1.6;
        }

        /* Header & Navigation */
        header {
            background: var(--cream-light);
            padding: 1.5rem 5%;
            border-bottom: 1px solid rgba(92, 64, 51, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--coffee-dark);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--coffee-medium);
            font-weight: 400;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--coffee-dark);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .btn-order {
            background: var(--coffee-dark);
            color: var(--cream);
            padding: 0.75rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid var(--coffee-dark);
        }

        .btn-order:hover {
            background: transparent;
            color: var(--coffee-dark);
            transform: translateY(-2px);
        }

        .user-icon {
            width: 40px;
            height: 40px;
            background: var(--cream);
            border: 2px solid var(--coffee-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-icon:hover {
            background: var(--coffee-dark);
            border-color: var(--coffee-dark);
        }

        .user-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--coffee-medium);
            transition: fill 0.3s ease;
        }

        .user-icon:hover svg {
            fill: var(--cream);
        }

        /* Main Content */
        .contact-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 0 5%;
            animation: fadeInUp 0.8s ease;
        }

        .contact-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .contact-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 1rem;
            color: var(--coffee-dark);
        }

        .contact-header p {
            font-size: 1.1rem;
            color: var(--coffee-medium);
        }

        /* Form Styles */
        .contact-form {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(44, 24, 16, 0.08);
        }

        .form-group {
            margin-bottom: 2rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--coffee-dark);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--cream);
            border-radius: 10px;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--cream-light);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: white;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Reason Buttons */
        .reason-group {
            margin-bottom: 2rem;
        }

        .reason-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--coffee-dark);
        }

        .reason-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .reason-btn {
            padding: 0.75rem 1.5rem;
            background: var(--cream);
            border: 2px solid var(--cream);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            color: var(--coffee-medium);
        }

        .reason-btn:hover {
            background: var(--cream-light);
            border-color: var(--coffee-light);
        }

        .reason-btn.active {
            background: var(--coffee-dark);
            color: var(--cream);
            border-color: var(--coffee-dark);
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 1.2rem;
            background: var(--coffee-dark);
            color: var(--cream);
            border: 2px solid var(--coffee-dark);
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Lato', sans-serif;
        }

        .submit-btn:hover {
            background: transparent;
            color: var(--coffee-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(44, 24, 16, 0.2);
        }

        /* Footer */
        footer {
            background: var(--coffee-dark);
            color: var(--cream);
            padding: 3rem 5%;
            text-align: center;
            margin-top: 5rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            list-style: none;
            margin-bottom: 0;
        }

        .footer-links a {
            color: var(--cream);
            text-decoration: none;
            transition: color 0.3s ease;
            opacity: 0.9;
        }

        .footer-links a:hover {
            color: var(--accent-gold);
            opacity: 1;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1.5rem;
                font-size: 0.9rem;
            }

            .contact-header h1 {
                font-size: 2.5rem;
            }

            .contact-form {
                padding: 2rem;
            }

            .footer-links {
                flex-wrap: wrap;
                gap: 1.5rem;
            }

            .reason-buttons {
                flex-direction: column;
            }

            .reason-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">LOGO</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="our-story.html">Our Story</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="order.html" class="btn-order">Order Now</a></li>
                <li>
                    <div class="user-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                        </svg>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <div class="contact-container">
        <div class="contact-header">
            <h1>Contact Us</h1>
            <p>Learn about our journey and commitment to quality.</p>
        </div>

        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
            </div>

            <div class="reason-group">
                <label>Select Your Reason</label>
                <div class="reason-buttons">
                    <button type="button" class="reason-btn active" data-reason="enquiry">Enquiry</button>
                    <button type="button" class="reason-btn" data-reason="comment">Comment</button>
                    <button type="button" class="reason-btn" data-reason="suggestion">Suggestion</button>
                    <button type="button" class="reason-btn" data-reason="order">Order</button>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Special Requests</label>
                <textarea id="message" name="message" placeholder="Any special requests?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>

    <footer>
        <ul class="footer-links">
            <li><a href="contact.html">Contact Us</a></li>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Terms of Service</a></li>
            <li><a href="#">Follow us on social media</a></li>
        </ul>
    </footer>

    <script>
        // Reason button functionality
        const reasonButtons = document.querySelectorAll('.reason-btn');
        let selectedReason = 'enquiry';

        reasonButtons.forEach(button => {
            button.addEventListener('click', function() {
                reasonButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                selectedReason = this.getAttribute('data-reason');
            });
        });

        // Form submission
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                reason: selectedReason,
                message: document.getElementById('message').value
            };

            console.log('Form submitted:', formData);
            alert('Thank you for contacting us! We will get back to you soon.');
            this.reset();
            reasonButtons[0].classList.add('active');
            selectedReason = 'enquiry';
        });
    </script>
</body>
</html>
