<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Cafe Delight</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <nav class="nav-wrapper">
            <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="Cafe Delight Logo"></a>
            <div class="nav-menu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="our-story.html">Our Story</a>
                <a href="contact.html">Contact</a>
                <a href="order.html" class="btn-nav">Order Now</a>
            </div>
            <button class="mobile-menu-btn" aria-label="Toggle menu"><span class="hamburger"><i class="fas fa-bars"></i></span><span class="close" style="display:none;"><i class="fas fa-times"></i></span></button>
            <div class="mobile-nav-container">
                <div class="mobile-nav-overlay"></div>
                <ul class="mobile-nav-links">
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="menu.html"><i class="fas fa-mug-hot"></i> Menu</a></li>
                    <li><a href="our-story.html"><i class="fas fa-book-open"></i> Our Story</a></li>
                    <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
                    <li><a href="order.html" class="btn-nav"><i class="fas fa-shopping-bag"></i> Order Now</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- ===== AUTH PAGE ===== -->
    <section class="auth-page">
        <div class="auth-container reveal">
            <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join Cafe Delight and start ordering today</p>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-shield-alt"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
                    </div>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the <a href="#" class="form-link">Terms of Service</a>
                </label>
                <button type="submit" class="btn btn-primary btn-wide">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html" class="form-link">Sign in</a></p>
        </div>
    </section>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/main.js"></script>
    <script>
        /* ===== Password Strength Meter ===== */
        document.getElementById('password').addEventListener('input', function() {
            const strength = document.getElementById('passwordStrength');
            const val = this.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
            const colors = ['', '#e74c3c', '#f39c12', '#2ecc71', '#27ae60'];
            strength.textContent = labels[score] || '';
            strength.style.color = colors[score] || '';
        });

        /* ===== Signup Form ===== */
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            if (!fullName || !email || !password || !confirmPassword) {
                storage.showToast('Please fill in all fields.', 'error');
                return;
            }
            if (!storage.validateEmail(email)) {
                storage.showToast('Please enter a valid email.', 'error');
                return;
            }
            if (!storage.validatePassword(password)) {
                storage.showToast('Password must be at least 8 characters with a number and uppercase letter.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                storage.showToast('Passwords do not match.', 'error');
                return;
            }
            if (!terms) {
                storage.showToast('Please agree to the Terms of Service.', 'error');
                return;
            }

            const result = auth.signup(fullName, email, password);
            if (result.success) {
                storage.showToast('Account created! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } else {
                storage.showToast(result.message || 'Signup failed.', 'error');
            }
        });
    </script>
</body>
</html>
